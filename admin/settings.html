<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Store Inventory</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="layout">
        
        <div class="mobile-sidebar-backdrop" id="mobileSidebarBackdrop"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📦</div>
                <div class="sidebar-title">Inventory System</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a href="products.html" class="nav-item">
                    <span class="nav-icon">📦</span> Products
                </a>
                <a href="categories.html" class="nav-item">
                    <span class="nav-icon">🏷️</span> Categories
                </a>
                <a href="stock-in.html" class="nav-item">
                    <span class="nav-icon">📥</span> Stock In
                </a>
                <a href="stock-out.html" class="nav-item">
                    <span class="nav-icon">📤</span> Stock Out
                </a>
                <a href="inventory.html" class="nav-item">
                    <span class="nav-icon">📋</span> Inventory
                </a>
                <a href="reports.html" class="nav-item">
                    <span class="nav-icon">📈</span> Reports
                </a>
                <a href="employees.html" class="nav-item">
                    <span class="nav-icon">👥</span> Employees
                </a>
                <a href="transactions.html" class="nav-item">
                    <span class="nav-icon">💳</span> Transactions
                </a>
                <a href="low-stock.html" class="nav-item">
                    <span class="nav-icon">⚠️</span> Low Stock
                </a>
                <a href="settings.html" class="nav-item active">
                    <span class="nav-icon">⚙️</span> Settings
                </a>
                
                <a href="danger-zone.html" class="nav-item">
    <span class="nav-icon">☠️</span> Danger Zone
</a>
                
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-icon">🚪</span> Logout
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-nav">
                <button class="mobile-menu-btn" id="menuBtn">☰</button>
                <h1 class="page-title">Settings</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <div class="user-avatar" id="userAvatar">A</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Store Settings</h2>
                </div>
                
                <form id="settingsForm">
                    <div class="form-group">
                        <label class="form-label">Store Name</label>
                        <input type="text" id="storeName" class="form-control" 
                               placeholder="Enter store name">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Store Address</label>
                        <textarea id="storeAddress" class="form-control" rows="3" 
                                  placeholder="Enter store address"></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Store Phone</label>
                        <input type="text" id="storePhone" class="form-control" 
                               placeholder="Enter store phone">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Default Low Stock Threshold</label>
                        <input type="number" id="lowStockThreshold" class="form-control" 
                               min="0" placeholder="10">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="../firebase-config.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/formatters.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/error-handler.js"></script>
    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>

    <script src="../js/admin/settings.js"></script>

<script>
(function () {
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const backdrop = document.getElementById('mobileSidebarBackdrop');
  if (!sidebar || !menuBtn || !backdrop) return;

  const syncBackdrop = () => {
    backdrop.classList.toggle('show', sidebar.classList.contains('open'));
  };

  menuBtn.addEventListener('click', () => setTimeout(syncBackdrop, 0));
  backdrop.addEventListener('click', () => {
    sidebar.classList.remove('open');
    syncBackdrop();
  });
  window.addEventListener('resize', syncBackdrop);
})();
</script>

</body>
</html>
