<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Test - Store Inventory</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="layout">
        
        <div class="mobile-sidebar-backdrop" id="mobileSidebarBackdrop"></div>
        <aside class="sidebar" id="sidebar">
            
        </aside>

        <main class="main-content">
            <div class="top-nav">
                <button class="mobile-menu-btn" id="menuBtn">☰</button>
                <h1 class="page-title">Security Test</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <div class="user-avatar" id="userAvatar">A</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Permission Tests</h2>
                    <button class="btn btn-primary" id="runTests">Run All Tests</button>
                </div>
                <div id="testResults">
                    <p>Click "Run All Tests" to test security permissions.</p>
                </div>
            </div>

            <div class="card" style="margin-top: 20px;">
                <div class="card-header">
                    <h2>Data Integrity Check</h2>
                    <button class="btn btn-primary" id="checkIntegrity">Check Integrity</button>
                </div>
                <div id="integrityResults">
                    <p>Click "Check Integrity" to validate data.</p>
                </div>
            </div>
        </main>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script src="../firebase-config.js"></script>

<script src="../js/utils.js"></script>
<script src="../js/formatters.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/error-handler.js"></script>
<script src="../js/firebase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/auth-guard.js"></script>

<script src="../js/stock-operations.js"></script>
<script src="../js/report-generator.js"></script>

<script src="../js/admin/dashboard.js"></script>

<script>
(function () {
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const backdrop = document.getElementById('mobileSidebarBackdrop');
  if (!sidebar || !menuBtn || !backdrop) return;

  const syncBackdrop = () => {
    backdrop.classList.toggle('show', sidebar.classList.contains('open'));
  };

  menuBtn.addEventListener('click', () => setTimeout(syncBackdrop, 0));
  backdrop.addEventListener('click', () => {
    sidebar.classList.remove('open');
    syncBackdrop();
  });
  window.addEventListener('resize', syncBackdrop);
})();
</script>

</body>
</html>
