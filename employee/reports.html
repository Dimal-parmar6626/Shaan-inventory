<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Store Inventory</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="layout">
        
        <div class="mobile-sidebar-backdrop" id="mobileSidebarBackdrop"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📦</div>
                <div class="sidebar-title">Inventory System</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a href="inventory.html" class="nav-item">
                    <span class="nav-icon">📋</span> Inventory
                </a>
                <a href="stock-in.html" class="nav-item">
                    <span class="nav-icon">📥</span> Stock In
                </a>
                <a href="stock-out.html" class="nav-item">
                    <span class="nav-icon">📤</span> Stock Out
                </a>
                <a href="history.html" class="nav-item">
                    <span class="nav-icon">📜</span> Stock History
                </a>
                <a href="reports.html" class="nav-item active">
                    <span class="nav-icon">📈</span> Reports
                </a>
                <a href="low-stock.html" class="nav-item">
                    <span class="nav-icon">⚠️</span> Low Stock
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-icon">🚪</span> Logout
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-nav">
                <button class="mobile-menu-btn" id="menuBtn">☰</button>
                <h1 class="page-title">Reports</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <div class="user-avatar" id="userAvatar">E</div>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button class="report-tab active" data-report="all" style="padding: 10px 20px; background: #4f46e5; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">All Transactions</button>
                <button class="report-tab" data-report="in" style="padding: 10px 20px; background: white; color: #4f46e5; border: 2px solid #4f46e5; border-radius: 6px; cursor: pointer; font-weight: bold;">Stock IN</button>
                <button class="report-tab" data-report="out" style="padding: 10px 20px; background: white; color: #4f46e5; border: 2px solid #4f46e5; border-radius: 6px; cursor: pointer; font-weight: bold;">Stock OUT</button>
            </div>

            <div class="card" style="margin-bottom: 20px;">
                <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: end;">
                    <div class="filter-group" style="flex: 1; min-width: 150px;">
                        <label class="form-label">Date Range</label>
                        <select id="dateFilter" class="form-control">
                            <option value="all">All Time</option>
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last7days">Last 7 Days</option>
                            <option value="last30days">Last 30 Days</option>
                        </select>
                    </div>
                    
                    <div class="filter-group" style="flex: 2; min-width: 200px;">
                        <label class="form-label">Search</label>
                        <input type="text" id="searchInput" class="form-control" placeholder="Search product...">
                    </div>
                    
                    <button class="btn btn-primary" id="applyFilters">Apply Filters</button>
                    <button class="btn btn-success" id="exportExcelBtn" style="background: #059669; color: white;">
                        📥 Export Excel
                    </button>
                </div>
            </div>

            <div class="dashboard-cards" style="margin-bottom: 20px;">
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">Total Transactions</span>
                        <div class="card-icon blue">💳</div>
                    </div>
                    <div class="card-value" id="totalTransactions">0</div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">Total Quantity</span>
                        <div class="card-icon green">📊</div>
                    </div>
                    <div class="card-value" id="totalQuantity">0</div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <span class="card-title">Total Value</span>
                        <div class="card-icon green">💰</div>
                    </div>
                    <div class="card-value" id="totalValue">₹0</div>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Product</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Rate</th>
                            <th>Total Value</th>
                            <th>User</th>
                        </tr>
                    </thead>
                    <tbody id="reportTableBody">
                        <tr>
                            <td colspan="7" class="text-center">Loading report...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>

    <script src="../firebase-config.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/formatters.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/error-handler.js"></script>
    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>

    <script src="../js/employee/reports.js"></script>

<script>
(function () {
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const backdrop = document.getElementById('mobileSidebarBackdrop');
  if (!sidebar || !menuBtn || !backdrop) return;

  const syncBackdrop = () => {
    backdrop.classList.toggle('show', sidebar.classList.contains('open'));
  };

  menuBtn.addEventListener('click', () => setTimeout(syncBackdrop, 0));
  backdrop.addEventListener('click', () => {
    sidebar.classList.remove('open');
    syncBackdrop();
  });
  window.addEventListener('resize', syncBackdrop);
})();
</script>

</body>
</html>
