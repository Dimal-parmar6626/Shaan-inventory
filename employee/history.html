<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock History - Store Inventory</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/tables.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="layout">
        
        <div class="mobile-sidebar-backdrop" id="mobileSidebarBackdrop"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">📦</div>
                <div class="sidebar-title">Inventory System</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <span class="nav-icon">📊</span> Dashboard
                </a>
                <a href="inventory.html" class="nav-item">
                    <span class="nav-icon">📋</span> Inventory
                </a>
                <a href="stock-in.html" class="nav-item">
                    <span class="nav-icon">📥</span> Stock In
                </a>
                <a href="stock-out.html" class="nav-item">
                    <span class="nav-icon">📤</span> Stock Out
                </a>
                <a href="history.html" class="nav-item active">
                    <span class="nav-icon">📜</span> Stock History
                </a>
                <a href="reports.html" class="nav-item">
                    <span class="nav-icon">📈</span> Reports
                </a>
                <a href="low-stock.html" class="nav-item">
                    <span class="nav-icon">⚠️</span> Low Stock
                </a>
                <a href="#" class="nav-item" id="logoutBtn">
                    <span class="nav-icon">🚪</span> Logout
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="top-nav">
                <button class="mobile-menu-btn" id="menuBtn">☰</button>
                <h1 class="page-title">My Stock History</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <div class="user-avatar" id="userAvatar">E</div>
                </div>
            </div>

            <div class="card" style="margin-bottom: 20px;">
                <div class="filters-container">
                    <div class="filter-group">
                        <label class="form-label">Date Range</label>
                        <select id="dateFilter" class="form-control">
                            <option value="today">Today</option>
                            <option value="yesterday">Yesterday</option>
                            <option value="last7days">Last 7 Days</option>
                            <option value="last30days">Last 30 Days</option>
                            <option value="all">All Time</option>
                        </select>
                    </div>
                    
                    <div class="filter-group">
                        <label class="form-label">Type</label>
                        <select id="typeFilter" class="form-control">
                            <option value="">All Types</option>
                            <option value="IN">Stock IN</option>
                            <option value="OUT">Stock OUT</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary" id="applyFilters">Apply Filters</button>
                </div>
            </div>

            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Product</th>
                            <th>Type</th>
                            <th>Quantity</th>
                            <th>Rate</th>
                            <th>Total Value</th>
                            <th>Previous Stock</th>
                            <th>New Stock</th>
                        </tr>
                    </thead>
                    <tbody id="historyTable">
                        <tr>
                            <td colspan="8" class="text-center">Loading history...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination" style="margin-top: 20px;">
                <button class="btn btn-secondary btn-sm" id="prevPage">Previous</button>
                <span id="pageInfo" style="margin: 0 10px;">Page 1</span>
                <button class="btn btn-secondary btn-sm" id="nextPage">Next</button>
            </div>
        </main>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="../firebase-config.js"></script>

    <script src="../js/utils.js"></script>
    <script src="../js/formatters.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/error-handler.js"></script>
    <script src="../js/firebase.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>

    <script src="../js/employee/history.js"></script>

<script>
(function () {
  const sidebar = document.getElementById('sidebar');
  const menuBtn = document.getElementById('menuBtn');
  const backdrop = document.getElementById('mobileSidebarBackdrop');
  if (!sidebar || !menuBtn || !backdrop) return;

  const syncBackdrop = () => {
    backdrop.classList.toggle('show', sidebar.classList.contains('open'));
  };

  menuBtn.addEventListener('click', () => setTimeout(syncBackdrop, 0));
  backdrop.addEventListener('click', () => {
    sidebar.classList.remove('open');
    syncBackdrop();
  });
  window.addEventListener('resize', syncBackdrop);
})();
</script>

</body>
</html>
